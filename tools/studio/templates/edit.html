{% extends 'base.html' %}
{% block content %}
<h2>{{ 'Edit Post' if post else 'New Post' }}</h2>

<form method="POST" class="bg-white p-4 shadow-sm rounded">
    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Title</label>
            <input type="text" name="title" class="form-control" value="{{ post.title if post else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Slug</label>
            <input type="text" name="slug" class="form-control" value="{{ post.slug if post else '' }}" required>
        </div>
    </div>

    <div class="row mb-3">
        <div class="col-md-6">
            <label class="form-label">Category</label>
            <input type="text" name="category" class="form-control" value="{{ post.category if post else '' }}" required>
        </div>
        <div class="col-md-6">
            <label class="form-label">Status</label>
            <select name="status" class="form-select">
                <option value="draft" {{ 'selected' if post and post.status == 'draft' }}>Draft</option>
                <option value="published" {{ 'selected' if post and post.status == 'published' }}>Published</option>
            </select>
        </div>
    </div>

    <div class="mb-3">
        <label class="form-label">Summary</label>
        <textarea name="summary" class="form-control" rows="2" required>{{ post.summary if post else '' }}</textarea>
    </div>

    <div class="mb-3">
        <label class="form-label">Content (Markdown)</label>
        <textarea name="content" class="form-control font-monospace" rows="12" required>{{ post.content if post else '' }}</textarea>
    </div>

    <button type="submit" class="btn btn-primary">Save Post</button>
    <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
</form>
{% endblock %}
