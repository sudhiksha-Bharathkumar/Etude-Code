<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ meta.title }}</title>
<meta name="description" content="{{ meta.description }}">
<link rel="canonical" href="{{ meta.url }}">
<meta property="og:site_name" content="{{ site.site_name }}">
<meta property="og:title" content="{{ meta.og_title }}">
<meta property="og:description" content="{{ meta.description }}">
<meta property="og:type" content="{{ meta.og_type }}">
<meta property="og:url" content="{{ meta.url }}">
{% if meta.image %}<meta property="og:image" content="{{ meta.image }}">
<meta name="twitter:image" content="{{ meta.image }}">{% endif %}
<meta name="twitter:card" content="{{ 'summary_large_image' if meta.image else 'summary' }}">
<meta name="twitter:title" content="{{ meta.og_title }}">
<meta name="twitter:description" content="{{ meta.description }}">
{% if meta.published %}<meta property="article:published_time" content="{{ meta.published }}">{% endif %}
{% if site.pinterest_verify %}<meta name="p:domain_verify" content="{{ site.pinterest_verify }}">{% endif %}
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top">
  <a class="brand" href="/">etude<span class="sig">&amp;</span>code</a>
  <nav>
    {% for c in cats %}<a href="/{{ c.slug }}/">{{ c.label }}</a>{% endfor %}
    <a href="/about/">About</a>
  </nav>
</header>
<main>
{% block content %}{% endblock %}
</main>
<footer class="foot">
  <span class="label"><span class="sig">//</span> {{ site.site_name }}</span>
  <span>{{ site.description }}</span>
</footer>
</body>
</html>
